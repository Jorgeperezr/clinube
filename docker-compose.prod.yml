# ── Producción ────────────────────────────────────────────────────────
# Uso: docker compose -f docker-compose.prod.yml up -d --build
# Diferencias con el compose de desarrollo:
#  - gunicorn sin --reload y sin montar el código (imagen inmutable)
#  - Postgres y Redis SIN puertos expuestos al host
#  - el panel se compila a estático y lo sirve Nginx (sin next dev)
#  - restart: unless-stopped en todos los servicios

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Configuración para el tamaño del servidor. Los valores de fábrica de
    # PostgreSQL son para una máquina de 512 MB; cada uno se ajusta en el
    # .env sin tocar este archivo (tabla por memoria en DEPLOY.md, «Base de
    # datos»). Los valores por omisión sirven para un servidor de 4 GB.
    #   · shared_buffers ≈ 25 % de la RAM; effective_cache_size ≈ 60–75 %.
    #   · random_page_cost 1.1 y effective_io_concurrency: el disco es SSD.
    #   · jit off: compila cada consulta y en las cortas (todas las de
    #     Clinube) tarda más en compilar que en ejecutar.
    #   · pg_stat_statements: qué consultas gastan más tiempo, para medir en
    #     vez de adivinar (`python manage.py consultas_lentas`).
    #   · log_min_duration_statement: deja en el registro toda consulta que
    #     pase de ese tiempo.
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      -c work_mem=${PG_WORK_MEM:-16MB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      -c max_connections=${PG_MAX_CONNECTIONS:-100}
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c wal_buffers=16MB
      -c min_wal_size=512MB
      -c max_wal_size=2GB
      -c checkpoint_completion_target=0.9
      -c default_statistics_target=100
      -c autovacuum_vacuum_scale_factor=0.05
      -c autovacuum_analyze_scale_factor=0.02
      -c idle_in_transaction_session_timeout=60s
      -c jit=off
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=top
      -c log_min_duration_statement=${PG_LOG_LENTAS_MS:-500}
    # Docker da 64 MB de memoria compartida y PostgreSQL la usa para las
    # consultas en paralelo: con menos de lo que pide, fallan con «could not
    # resize shared memory segment».
    shm_size: ${PG_SHM_SIZE:-512mb}
    # El compose de desarrollo tenía esta sonda y el de producción no, así
    # que aquí `depends_on: postgres` solo esperaba a que el contenedor
    # arrancara. En un arranque en frío o tras reiniciar el host, `migrate`
    # se ejecutaba contra una base que todavía no aceptaba conexiones: el
    # contenedor moría, `restart: unless-stopped` lo reintentaba y acababa
    # levantando, pero con un ciclo de caídas y el registro lleno de ruido.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cola de Celery (base 0) y caché de Django (base 1).
    #   · appendonly: las tareas en cola sobreviven a un reinicio del
    #     contenedor (antes se perdían: un recordatorio pendiente no salía).
    #   · maxmemory + volatile-lru: con el tope lleno solo se descartan
    #     claves con caducidad —las de la caché—, nunca las de la cola.
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  django-api:
    build: ./django-api
    restart: unless-stopped
    env_file: .env
    # No arranca con claves de ejemplo ni con DEBUG (config/produccion.py).
    environment:
      DJANGO_ENTORNO: produccion
      CACHE_URL: redis://redis:6379/1
    command: >
      sh -c "python manage.py migrate &&
             python manage.py bootstrap &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --threads ${GUNICORN_THREADS:-2} --timeout 60 --keep-alive 5"
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # La imagen es python:3.12-slim y no trae curl ni wget; urllib sí.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/ready/', timeout=5).status == 200 else 1)\""]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 60s

  celery-worker:
    build: ./django-api
    restart: unless-stopped
    env_file: .env
    # No arranca con claves de ejemplo ni con DEBUG (config/produccion.py).
    environment:
      DJANGO_ENTORNO: produccion
      CACHE_URL: redis://redis:6379/1
    command: celery -A config worker -l info --concurrency ${CELERY_CONCURRENCY:-2}
    depends_on:
      django-api:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: ./django-api
    restart: unless-stopped
    env_file: .env
    # No arranca con claves de ejemplo ni con DEBUG (config/produccion.py).
    environment:
      DJANGO_ENTORNO: produccion
      CACHE_URL: redis://redis:6379/1
    command: celery -A config beat -l info
    depends_on:
      django-api:
        condition: service_healthy
      redis:
        condition: service_healthy

  whatsapp-gateway:
    build: ./whatsapp-gateway
    restart: unless-stopped
    env_file: .env
    command: uvicorn main:app --host 0.0.0.0 --port 8001

  # Compila el panel a estático y lo deja en el volumen que Nginx sirve.
  # Corre una vez en cada despliegue y termina (restart: "no").
  frontend-build:
    image: node:20-alpine
    working_dir: /app
    restart: "no"
    command: >
      sh -c "npm install --no-audit --no-fund &&
             NEXT_EXPORT=1 NEXT_TELEMETRY_DISABLED=1 npm run build &&
             rm -rf /static-out/* && cp -r out/. /static-out/"
    # Enlaces de las tiendas para /descargar/. Se leen al compilar: tras
    # cambiarlos en el .env hay que volver a lanzar este servicio.
    environment:
      NEXT_PUBLIC_URL_APP_STORE: ${URL_APP_STORE:-}
      NEXT_PUBLIC_URL_GOOGLE_PLAY: ${URL_GOOGLE_PLAY:-}
    volumes:
      - ./frontend:/app
      - frontend_static:/static-out

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Por omisión solo escucha en la propia máquina: el tráfico de fuera
    # entra por Cloudflare Tunnel, que se conecta a localhost. Así no hay
    # que abrir puertos en la nube (en Oracle, ni en la lista de
    # seguridad ni en el cortafuegos de la VM). Para servir con IP
    # pública y certificado propio (Opción A), NGINX_PUERTO=80 en el .env.
    ports:
      - "${NGINX_PUERTO:-127.0.0.1:80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_static:/usr/share/nginx/html:ro
      - media_data:/app/media:ro
    depends_on:
      django-api:
        condition: service_healthy
      whatsapp-gateway:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  media_data:
  frontend_static:
