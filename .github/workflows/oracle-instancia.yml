# Crea la máquina de Clinube en Oracle Cloud sin tener Cloud Shell abierto.
#
# Cada 20 minutos intenta UNA vez crear la instancia Always Free (Ampere
# A1, 1 OCPU, 6 GB, 100 GB) con scripts/crear-instancia-oracle.sh. En
# Santiago casi nunca hay capacidad: la mayoría de las vueltas terminan
# en «sin capacidad», en verde y sin avisar. Cuando sale:
#
#   · abre una incidencia en el repositorio con la IP (llega por correo),
#   · y se desactiva a sí mismo, para no seguir gastando minutos.
#
# Necesita cuatro secretos (Settings → Secrets and variables → Actions):
# OCI_USER_OCID, OCI_TENANCY_OCID, OCI_FINGERPRINT y OCI_PRIVATE_KEY.
# Cómo sacarlos: DEPLOY.md, «Crear la máquina desde GitHub Actions». Sin
# ellos, cada vuelta termina enseguida sin hacer nada.
#
# Minutos: cada vuelta dura unos 45 s y se cobra como 1 minuto. Con la
# cuenta Pro (estudiante) hay 3000 al mes para repositorios privados; cada
# 20 minutos son unos 2200, y el CI gasta unos 7 por push. Cada 15 serían
# unos 2900 y, si se acaban, también se para el CI hasta el mes siguiente.
# Por eso no es más frecuente, y por eso se apaga al crear la máquina.

name: Crear la máquina en Oracle

on:
  schedule:
    # Minutos sueltos y no en punto: a las :00 GitHub retrasa las vueltas.
    - cron: "2,22,42 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: oracle-instancia
  cancel-in-progress: false

jobs:
  intentar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OCI_CLI_REGION: sa-santiago-1
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
      # Pública: es la que se instala en la máquina para entrar por SSH.
      CLAVE_SSH_PUBLICA: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAJuRUm5AbXHD3i/K6SF2hqq6Ssgh5qBPhTUNhfh6FVa clinube"
      TIENE_CREDENCIALES: ${{ secrets.OCI_PRIVATE_KEY != '' && secrets.OCI_USER_OCID != '' }}
    steps:
      - name: ¿Hay credenciales?
        if: env.TIENE_CREDENCIALES != 'true'
        run: |
          echo "Faltan los secretos OCI_* (ver DEPLOY.md). No se intenta nada." >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/checkout@v4
        if: env.TIENE_CREDENCIALES == 'true'

      - name: OCI CLI
        if: env.TIENE_CREDENCIALES == 'true'
        run: pip install --quiet --disable-pip-version-check oci-cli

      - name: Configuración de OCI
        if: env.TIENE_CREDENCIALES == 'true'
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p ~/.oci
          # Se aceptan los valores tal como los da la vista previa de
          # Oracle: con o sin «user=» / «tenancy=» / «fingerprint=» delante,
          # y sin que importen espacios o saltos de línea pegados de más.
          limpiar() {
            printf '%s' "$1" | tr -d '\r' \
              | sed -E 's/^[[:space:]]*(user|tenancy|fingerprint)[[:space:]]*=//' \
              | tr -d '[:space:]'
          }
          USUARIO="$(limpiar "${OCI_USER_OCID}")"
          ARRENDAMIENTO="$(limpiar "${OCI_TENANCY_OCID}")"
          HUELLA="$(limpiar "${OCI_FINGERPRINT}")"
          MAL=0
          [[ "${USUARIO}" =~ ^ocid1\.user\. ]] || { echo "::error::OCI_USER_OCID no empieza por ocid1.user. (copia solo el valor de user=)"; MAL=1; }
          [[ "${ARRENDAMIENTO}" =~ ^ocid1\.tenancy\. ]] || { echo "::error::OCI_TENANCY_OCID no empieza por ocid1.tenancy. (copia solo el valor de tenancy=)"; MAL=1; }
          [[ "${HUELLA}" =~ ^([0-9a-f]{2}:){15}[0-9a-f]{2}$ ]] || { echo "::error::OCI_FINGERPRINT no tiene la forma aa:bb:…:ff (16 pares)"; MAL=1; }
          [ "${MAL}" -eq 0 ] || exit 1

          # La clave privada. Se comprueba antes de dárscela a la CLI, que
          # solo dice «not a private key» sin explicar por qué.
          CLAVE="$(printf '%s\n' "${OCI_PRIVATE_KEY}" | tr -d '\r')"
          if grep -q "PUBLIC KEY" <<< "${CLAVE}"; then
            echo "::error::OCI_PRIVATE_KEY contiene la clave PÚBLICA. Hace falta la privada: el archivo de «Descargar clave privada»."
            exit 1
          fi
          TIPO="$(grep -oE 'BEGIN [A-Z ]*PRIVATE KEY' <<< "${CLAVE}" | head -1 | sed 's/^BEGIN //')"
          if [ -z "${TIPO}" ]; then
            echo "::error::OCI_PRIVATE_KEY no tiene la línea -----BEGIN PRIVATE KEY-----. Pega el .pem entero."
            exit 1
          fi
          # Al copiar y pegar se cuelan cosas: saltos de línea perdidos,
          # espacios al principio de cada línea, «\n» escritos como texto.
          # Se toma solo lo que hay entre BEGIN y END, se deja únicamente lo
          # que es base64 y se rearma en líneas de 64, como la escribe Oracle.
          CUERPO="$(printf '%s' "${CLAVE}" | sed 's/\\n/\n/g' \
            | tr '\n' ' ' | sed -E "s/.*BEGIN ${TIPO}-+//; s/-+END ${TIPO}.*//" \
            | tr -cd 'A-Za-z0-9+/=')"
          CLAVE="$(printf '%s\n%s\n%s' "-----BEGIN ${TIPO}-----" "$(fold -w 64 <<< "${CUERPO}")" "-----END ${TIPO}-----")"
          printf '%s\n' "${CLAVE}" | grep -v '^OCI_API_KEY$' > ~/.oci/clave.pem
          if ! openssl pkey -in ~/.oci/clave.pem -noout 2>/dev/null; then
            echo "::error::OCI_PRIVATE_KEY no se puede leer como clave privada aunque se limpió (${#CUERPO} caracteres de clave; una de 2048 bits tiene unos 1620). Está incompleta: vuelve a copiarla con pbcopy (DEPLOY.md)."
            exit 1
          fi
          # ¿Es la clave de esa huella? Si no, Oracle diría «NotAuthenticated».
          CALCULADA="$(openssl pkey -in ~/.oci/clave.pem -pubout -outform DER 2>/dev/null | openssl md5 -c | awk '{print $NF}')"
          if [ "${CALCULADA}" != "${HUELLA}" ]; then
            echo "::error::La clave privada no corresponde a OCI_FINGERPRINT: actualiza los dos con la misma clave de API."
            exit 1
          fi
          # La etiqueta que Oracle añade a sus claves; sin ella, la CLI avisa.
          echo "OCI_API_KEY" >> ~/.oci/clave.pem
          {
            echo "[DEFAULT]"
            echo "user=${USUARIO}"
            echo "fingerprint=${HUELLA}"
            echo "tenancy=${ARRENDAMIENTO}"
            echo "region=${OCI_CLI_REGION}"
            echo "key_file=${HOME}/.oci/clave.pem"
          } > ~/.oci/config

      - name: Intentar crear la máquina
        if: env.TIENE_CREDENCIALES == 'true'
        env:
          SALIDA_IP: ip.txt
        run: |
          bash scripts/crear-instancia-oracle.sh | tee -a "${GITHUB_STEP_SUMMARY}"
          exit "${PIPESTATUS[0]}"

      - name: Avisar y apagar este flujo
        if: env.TIENE_CREDENCIALES == 'true' && hashFiles('ip.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IP="$(cat ip.txt)"
          [ -n "${IP}" ] || exit 0
          gh issue create \
            --title "Oracle: la máquina de Clinube está creada (IP ${IP})" \
            --body "$(printf '%s\n' \
              "La instancia **clinube** ya existe en Oracle Cloud (Santiago)." \
              "" \
              "- IP pública: \`${IP}\`" \
              "- Entrar desde el Mac: \`ssh -i ~/.ssh/clinube ubuntu@${IP}\`" \
              "" \
              "Siguiente paso: DEPLOY.md, desde «Preparar el servidor»." \
              "" \
              "El flujo «Crear la máquina en Oracle» se ha desactivado solo.")" \
            || echo "No se pudo abrir la incidencia (¿están desactivadas en el repositorio?). IP: ${IP}"
          gh workflow disable oracle-instancia.yml
          echo "### Máquina creada: ${IP}. Flujo desactivado." >> "${GITHUB_STEP_SUMMARY}"
