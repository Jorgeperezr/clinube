worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    client_max_body_size 20M;

    # Archivos estáticos sin copiarlos por el espacio de usuario, y sin
    # anunciar la versión de nginx en cada respuesta y página de error.
    sendfile on;
    tcp_nopush on;
    server_tokens off;

    # Compresión. El JavaScript del panel pesa la cuarta parte comprimido
    # (el del odontograma 3D, de 684 KB a 168 KB) y el JSON de la API,
    # bastante menos. Cloudflare ya comprime hacia el navegador; esto
    # aligera el tramo del servidor a Cloudflare y cualquier despliegue
    # sin él. Los PDF, imágenes y woff2 ya vienen comprimidos.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    # El esquema con el que llegó el usuario. Detrás de Cloudflare Tunnel
    # la conexión que recibe Nginx es HTTP aunque el usuario esté en
    # HTTPS; Cloudflare lo dice en X-Forwarded-Proto y aquí se respeta.
    # Antes se mandaba $scheme («http»), Django creía que todo era HTTP
    # y las direcciones absolutas que devuelve —el logotipo de la clínica
    # para la app— salían con http://, que Android e iOS bloquean.
    # Sin proxy delante, el esquema real de la conexión.
    map $http_x_forwarded_proto $proto_original {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # La raíz del dominio (clinube.com y www) es la portada pública; la de
    # app.clinube.com sigue siendo el panel. Localhost y las IP, el panel.
    map $host $es_portada {
        default 0;
        "~*^(www\.)?[a-z0-9-]+\.[a-z]{2,}$" 1;
    }

    # Buscadores e IA. La portada se puede indexar, pero no usar para
    # entrenar ni alimentar modelos de IA (noai); el panel y la API no se
    # indexan ni se archivan en ninguna parte. Es una petición que respetan
    # los rastreadores serios, no un candado: el candado es el inicio de
    # sesión, y el bloqueo de bots de IA de Cloudflare (DEPLOY.md).
    map $es_portada $cabecera_robots {
        1 "noai, noimageai";
        0 "noindex, nofollow, noarchive, nosnippet, noai, noimageai";
    }
    map $es_portada $archivo_robots {
        1 /robots.txt;
        0 /robots-panel.txt;
    }

    upstream django_api {
        server django-api:8000;
        # Conexiones abiertas con gunicorn para reutilizarlas: sin esto,
        # cada petición abría y cerraba una (gunicorn usa hilos y las
        # mantiene, --keep-alive en docker-compose.prod.yml).
        keepalive 16;
    }

    upstream whatsapp_gateway {
        server whatsapp-gateway:8001;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Robots-Tag $cabecera_robots always;

        location = /robots.txt {
            root /usr/share/nginx/html;
            default_type text/plain;
            try_files $archivo_robots =404;
        }

        # API y panel de administración de Django
        location /api/ {
            proxy_pass http://django_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proto_original;
        }

        # Inicio de sesión, códigos y tokens: SIN compresión. Comprimir una
        # respuesta que lleva un secreto (el token) junto a algo que elige
        # quien pide permite adivinarlo midiendo tamaños (ataque BREACH).
        location /api/v1/auth/ {
            gzip off;
            proxy_pass http://django_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proto_original;
        }

        # Abrir una copia de la clínica desde el panel admite hasta 60 MB
        # (MAX_BACKUP_UPLOAD en apps/configuration/views.py); con el tope
        # general de 20 MB Nginx la cortaba antes con un 413 sin explicación.
        location = /api/v1/config/backup/decrypt/ {
            client_max_body_size 61M;
            proxy_pass http://django_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proto_original;
        }

        # ── Archivos subidos ─────────────────────────────────────────
        # Django solo publica /media/ cuando DEBUG=True, así que en
        # producción esta ruta devolvía 404 y el logotipo de la clínica
        # no se veía. Se sirve desde disco, PERO solo la carpeta del
        # logotipo: el resto de /media/ son radiografías, documentos de
        # pacientes, consentimientos firmados y firmas manuscritas. Nginx
        # no sabe quién pide el archivo, de modo que publicarlos aquí los
        # dejaría al alcance de cualquiera que acierte la URL, sin sesión
        # y sin registro de acceso. Esos archivos se entregan por la API,
        # que valida clínica, paciente y permisos
        # (PatientDocumentFileView, Sprint 38).
        location /media/branding/ {
            alias /app/media/branding/;
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Robots-Tag $cabecera_robots always;
            access_log off;
        }

        # Cortafuegos explícito: cualquier otra ruta bajo /media/ se niega
        # aquí, para que un cambio futuro no la abra por descuido.
        location /media/ {
            return 404;
        }

        location /static/ {
            proxy_pass http://django_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proto_original;
        }

        location /admin/ {
            proxy_pass http://django_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $proto_original;
        }

        # Webhook público de WhatsApp — únicamente esta ruta llega al gateway
        location /whatsapp/webhook {
            proxy_pass http://whatsapp_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # La dirección en inglés que la gente prueba por costumbre.
        location ~ ^/download/?$ {
            return 301 /descargar/;
        }

        # El service worker de la app instalable no se guarda en caché:
        # si el navegador se quedara con uno viejo, la app no se enteraría
        # de los despliegues nuevos.
        location = /sw.js {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
            add_header X-Robots-Tag $cabecera_robots always;
        }

        # El mime.types de la imagen de Nginx no conoce .webmanifest: sin
        # esto saldría como application/octet-stream y algunos navegadores
        # no ofrecerían instalar la app.
        location = /manifest.webmanifest {
            root /usr/share/nginx/html;
            default_type application/manifest+json;
            types { }
        }

        # Fuentes, iconos y mallas del odontograma: cambian muy de vez en
        # cuando y no llevan hash en el nombre, así que un mes y no un año.
        location ~ ^/(fonts|icons|models)/ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=2592000";
            add_header X-Robots-Tag $cabecera_robots always;
            access_log off;
        }

        # Los archivos de Next llevan un hash en el nombre: si cambian,
        # cambia el nombre. Se pueden guardar un año.
        location /_next/static/ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Robots-Tag $cabecera_robots always;
        }

        location = / {
            if ($es_portada) {
                rewrite ^ /inicio/ last;
            }
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Build estático de Next.js (panel web) — se monta aquí en la Fase 9/Frontend
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
