openapi: 3.0.3
info:
  title: API — Clinube
  version: 1.0.0
  description: Ver el documento 05-APIs-Clinica-Odontologica.md para el contrato completo.
paths:
  /api/v1/agenda/view/:
    get:
      operationId: api_v1_agenda_view_list
      description: |-
        GET /api/v1/agenda/view/?mode=daily|weekly|monthly&doctor_id=&date=
        Vista consolidada de la agenda (RF-AGN-01, 02). Devuelve las citas
        del rango correspondiente al modo y fecha ancla.
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentList'
          description: ''
  /api/v1/app/citas/:
    get:
      operationId: api_v1_app_citas_retrieve
      description: GET /api/v1/app/citas/ — las suyas, próximas primero.
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/app/citas/{id}/confirmar/:
    post:
      operationId: api_v1_app_citas_confirmar_create
      description: |-
        POST /api/v1/app/citas/{id}/confirmar/ — «Sí, asistiré».

        Lo mismo que contestar «sí» al recordatorio de WhatsApp, sin depender
        de que el paciente lo haya autorizado: una cita confirmada es un hueco
        que recepción no tiene que perseguir por teléfono.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/app/clinica/:
    get:
      operationId: api_v1_app_clinica_retrieve
      description: |-
        GET /api/v1/app/clinica/ — nombre, logotipo y colores de SU clínica.

        Hacía falta un endpoint nuevo en vez de abrir `/config/branding/` al
        rol de paciente: aquel devuelve el registro entero y está pensado
        para el panel. Aquí sale solo lo que la app pinta, y el tenant lo
        decide el token, como todo lo demás de esta app.

        **Los colores llegan ya resueltos**, en #rrggbb. La app no guarda
        ninguna tabla de temas: si la guardara, el día que alguien añada un
        tema al panel la misma clínica se vería de un color en el escritorio
        y de otro en el teléfono.

        El logotipo se devuelve como URL ABSOLUTA porque la app no vive en
        el mismo origen que la API —el panel sí, y por eso a él le vale la
        ruta relativa—. Nginx publica `/media/branding/` y niega el resto de
        `/media/`, así que el logotipo es alcanzable sin token y las
        radiografías no.
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/app/cuenta/:
    get:
      operationId: api_v1_app_cuenta_retrieve
      description: |-
        GET /api/v1/app/cuenta/ — si la cuenta ya está enlazada con su ficha.

        Lo primero que pregunta la app al entrar. Una cuenta creada por el
        propio paciente no tiene clínica hasta que la recepción le da acceso
        desde la ficha: entonces la app explica qué hacer en vez de fallar.
        Sin `RequiereFuncionalidad`: una cuenta sin clínica no tiene función
        que mirar.
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/app/indicaciones/:
    get:
      operationId: api_v1_app_indicaciones_retrieve
      description: |-
        GET /api/v1/app/indicaciones/ — recetas e indicaciones de cuidado.

        Solo las marcadas como visibles (RF-APP-03) y solo de esos dos tipos:
        las notas clínicas internas no salen de la clínica. El filtro es por
        lista blanca de tipos y no por exclusión, para que un tipo nuevo no
        acabe publicado en la app por olvido.
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/app/logros/:
    get:
      operationId: api_v1_app_logros_retrieve
      description: |-
        GET /api/v1/app/logros/ — sus rachas y logros.

        Lo que se devuelve es lo CONCEDIDO, no lo que el paciente cumpliría
        hoy si se evaluaran las reglas. Un logro es un hecho con su fecha;
        recalcularlo al leerlo haría que alguien perdiera una medalla por
        faltar a una cita este mes, que es lo contrario de lo que premia un
        programa de fidelidad.

        `racha` cuenta los meses seguidos del mismo logro automático, que es
        lo que la app enseña como «3 meses seguidos».
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/app/me/:
    get:
      operationId: api_v1_app_me_retrieve
      description: GET /api/v1/app/me/ — lo que la app muestra al abrirse.
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/app/mensajes/:
    get:
      operationId: api_v1_app_mensajes_retrieve
      description: GET/POST /api/v1/app/mensajes/
      tags:
      - api
      responses:
        '200':
          description: No response body
    post:
      operationId: api_v1_app_mensajes_create
      description: GET/POST /api/v1/app/mensajes/
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/app/saldo/:
    get:
      operationId: api_v1_app_saldo_retrieve
      description: GET /api/v1/app/saldo/ — cuánto debe y cuándo vence cada cuota.
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/app/solicitudes-cita/:
    get:
      operationId: api_v1_app_solicitudes_cita_retrieve
      description: GET/POST /api/v1/app/solicitudes-cita/
      tags:
      - api
      responses:
        '200':
          description: No response body
    post:
      operationId: api_v1_app_solicitudes_cita_create
      description: GET/POST /api/v1/app/solicitudes-cita/
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/appointments/:
    get:
      operationId: api_v1_appointments_list
      description: |-
        GET/POST /api/v1/appointments/ — RF-AGN-03.
        Filtros: ?doctor_id=&status=&date_from=&date_to=
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentList'
          description: ''
    post:
      operationId: api_v1_appointments_create
      description: |-
        GET/POST /api/v1/appointments/ — RF-AGN-03.
        Filtros: ?doctor_id=&status=&date_from=&date_to=
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Appointment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Appointment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Appointment'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/v1/appointments/{id}/:
    get:
      operationId: api_v1_appointments_retrieve
      description: GET/PATCH /api/v1/appointments/{id}/
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
    put:
      operationId: api_v1_appointments_update
      description: GET/PATCH /api/v1/appointments/{id}/
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Appointment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Appointment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Appointment'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
    patch:
      operationId: api_v1_appointments_partial_update
      description: GET/PATCH /api/v1/appointments/{id}/
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAppointment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAppointment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAppointment'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/v1/appointments/{id}/cancel/:
    post:
      operationId: api_v1_appointments_cancel_create
      description: POST /appointments/{id}/cancel/ — RF-AGN-04.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/appointments/{id}/checkin/:
    post:
      operationId: api_v1_appointments_checkin_create
      description: |-
        POST /appointments/{id}/checkin/ — RF-AGN-05.
        Dispara aviso al doctor por WhatsApp (RF-WSP-05) — se activa en Sprint 10.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/appointments/{id}/checkout/:
    post:
      operationId: api_v1_appointments_checkout_create
      description: POST /appointments/{id}/checkout/ — RF-AGN-05.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/appointments/{id}/confirm/:
    post:
      operationId: api_v1_appointments_confirm_create
      description: POST /appointments/{id}/confirm/ — RF-AGN-04.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/appointments/{id}/reschedule/:
    post:
      operationId: api_v1_appointments_reschedule_create
      description: POST /appointments/{id}/reschedule/ — RF-AGN-04.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/appointments/{id}/start/:
    post:
      operationId: api_v1_appointments_start_create
      description: |-
        POST /api/v1/appointments/{id}/start/ — inicio de la atención.
        Flujo completo: check-in (llegó, en espera) → start (en atención)
        → checkout (finalizada). Requiere check-in previo.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/appointments/waiting/:
    get:
      operationId: api_v1_appointments_waiting_retrieve
      description: |-
        GET /api/v1/appointments/waiting/ — Sprint 45.
        Pacientes que ya llegaron a la clínica y aún no son atendidos. El
        odontólogo ve solo los suyos; admin y recepción ven los de toda la
        clínica (para saber a quién avisar).

        No requiere un modelo de notificaciones: la señal ya está en los datos
        —hay check-in registrado y la atención no ha comenzado—, de modo que
        el aviso es siempre coherente con el estado real de la agenda.
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/audit-logs/:
    get:
      operationId: api_v1_audit_logs_list
      description: GET /api/v1/audit-logs/ — RF-USR-05
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/auth/change-password/:
    post:
      operationId: api_v1_auth_change_password_create
      description: |-
        POST /api/v1/auth/change-password/ {current_password?, new_password}

        `current_password` se exige SALVO que la contraseña sea temporal: en
        ese caso quien la puso fue otra persona y pedírsela al usuario sería
        pedirle que repita un secreto que no es suyo.
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/auth/google/:
    post:
      operationId: api_v1_auth_google_create
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/google/config/:
    get:
      operationId: api_v1_auth_google_config_retrieve
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: api_v1_auth_login_create
      description: POST /api/v1/auth/login/ — RF-USR-01
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffLogin'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffLogin'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: api_v1_auth_me_retrieve
      description: |-
        GET /api/v1/auth/me/ — perfil del usuario autenticado.
        El panel web lo usa tras el login para conocer nombre y rol
        (la navegación se filtra por rol en el cliente).
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/preferencias/:
    get:
      operationId: api_v1_auth_me_preferencias_retrieve
      description: |-
        GET/PATCH /api/v1/auth/me/preferencias/ — las preferencias PROPIAS.

        No lleva identificador de usuario en la ruta a propósito: cada cual
        solo puede tocar las suyas, y así no hay ninguna forma de pedir las
        de otro. `disponibles` dice cuáles tienen efecto en su clínica, para
        que el panel pueda explicar por qué un interruptor no hace nada.
      tags:
      - api
      responses:
        '200':
          description: No response body
    patch:
      operationId: api_v1_auth_me_preferencias_partial_update
      description: |-
        GET/PATCH /api/v1/auth/me/preferencias/ — las preferencias PROPIAS.

        No lleva identificador de usuario en la ruta a propósito: cada cual
        solo puede tocar las suyas, y así no hay ninguna forma de pedir las
        de otro. `disponibles` dice cuáles tienen efecto en su clínica, para
        que el panel pueda explicar por qué un interruptor no hace nada.
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/auth/otp/canal/:
    get:
      operationId: api_v1_auth_otp_canal_retrieve
      description: |-
        GET /api/v1/auth/otp/canal/ — por dónde llega hoy el código: la app lo
        pregunta para pedir el teléfono («whatsapp») o el correo («correo»).
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/otp/request/:
    post:
      operationId: api_v1_auth_otp_request_create
      description: |-
        POST /api/v1/auth/otp/request/ — RF-USR-02, RF-WSP-01.

        El paciente manda {"phone": …} o {"email": …}; el código le llega por
        el canal que elija la plataforma (ver apps/accounts/acceso_paciente.py).
        Para WhatsApp, Django decide *cuándo/qué* enviar y el microservicio
        FastAPI *cómo* llega a Meta (Arquitectura v1.2, sección 2).
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/otp/verify/:
    post:
      operationId: api_v1_auth_otp_verify_create
      description: POST /api/v1/auth/otp/verify/ — RF-USR-02. Teléfono o correo, y
        el código.
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/recovery/confirm/:
    post:
      operationId: api_v1_auth_recovery_confirm_create
      description: POST /api/v1/auth/recovery/confirm/ — RF-USR-04.
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/recovery/request/:
    post:
      operationId: api_v1_auth_recovery_request_create
      description: POST /api/v1/auth/recovery/request/ — RF-USR-04 (staff, por correo).
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/token/refresh/:
    post:
      operationId: api_v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/bandeja-app/mensajes/:
    get:
      operationId: api_v1_bandeja_app_mensajes_retrieve
      description: GET /api/v1/bandeja-app/mensajes/?pendientes=1
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/bandeja-app/mensajes/{id}/responder/:
    post:
      operationId: api_v1_bandeja_app_mensajes_responder_create
      description: POST /api/v1/bandeja-app/mensajes/<id>/responder/ { respuesta }
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/bandeja-app/resumen/:
    get:
      operationId: api_v1_bandeja_app_resumen_retrieve
      description: GET /api/v1/bandeja-app/resumen/ — lo pendiente, para el contador
        del menú.
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/bandeja-app/solicitudes/:
    get:
      operationId: api_v1_bandeja_app_solicitudes_retrieve
      description: GET /api/v1/bandeja-app/solicitudes/?estado=pendiente|todas
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/bandeja-app/solicitudes/{id}/agendar/:
    post:
      operationId: api_v1_bandeja_app_solicitudes_agendar_create
      description: |-
        POST /api/v1/bandeja-app/solicitudes/<id>/agendar/
        { doctor, scheduled_start, scheduled_end, notes? }

        Crea la cita y marca la solicitud, las dos cosas o ninguna.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/bandeja-app/solicitudes/{id}/rechazar/:
    post:
      operationId: api_v1_bandeja_app_solicitudes_rechazar_create
      description: POST /api/v1/bandeja-app/solicitudes/<id>/rechazar/ { respuesta
        }
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/budgets/{id}/:
    get:
      operationId: api_v1_budgets_retrieve
      description: GET/PATCH /api/v1/budgets/{id}/
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
    put:
      operationId: api_v1_budgets_update
      description: GET/PATCH /api/v1/budgets/{id}/
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Budget'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Budget'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Budget'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
    patch:
      operationId: api_v1_budgets_partial_update
      description: GET/PATCH /api/v1/budgets/{id}/
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBudget'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBudget'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBudget'
      responses:
