components:
  schemas:
    Agreement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        discount_percentage:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        is_active:
          type: boolean
        patient_count:
          type: integer
          readOnly: true
          default: 0
      required:
      - id
      - name
      - patient_count
    Appointment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        patient:
          type: string
          format: uuid
        patient_name:
          type: string
          readOnly: true
        doctor:
          type: string
          format: uuid
        doctor_name:
          type: string
          readOnly: true
        treatment:
          type: string
          format: uuid
          nullable: true
        scheduled_start:
          type: string
          format: date-time
        scheduled_end:
          type: string
          format: date-time
        status:
          allOf:
          - $ref: '#/components/schemas/AppointmentStatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        notes:
          type: string
        checkin_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        attention_started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: 'Cuándo el doctor inició la atención (flujo: llegó → en atención
            → finalizada).'
        reminder_sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Cuándo se envió el recordatorio WhatsApp (evita duplicados).
        checkout_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attention_started_at
      - checkin_at
      - checkout_at
      - created_at
      - doctor
      - doctor_name
      - id
      - patient
      - patient_name
      - reminder_sent_at
      - scheduled_end
      - scheduled_start
      - status
      - status_display
    AppointmentStatusEnum:
      enum:
      - pending
      - confirmed
      - cancelled
      - rescheduled
      - completed
      - no_show
      type: string
      description: |-
        * `pending` - Pendiente
        * `confirmed` - Confirmada
        * `cancelled` - Cancelada
        * `rescheduled` - Reagendada
        * `completed` - Completada
        * `no_show` - No asistió
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        user_email:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        entity_type:
          type: string
          readOnly: true
        entity_id:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        metadata:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - created_at
      - entity_id
      - entity_type
      - id
      - ip_address
      - metadata
      - user
      - user_email
    Batch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
        batch_number:
          type: string
          maxLength: 100
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        expiration_date:
          type: string
          format: date
          nullable: true
        received_at:
          type: string
          format: date
          readOnly: true
        costo_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          writeOnly: true
        proveedor:
          type: string
          writeOnly: true
          maxLength: 150
        proveedor_ruc:
          type: string
          writeOnly: true
          maxLength: 13
        numero_factura:
          type: string
          writeOnly: true
          maxLength: 20
        forma_pago:
          type: string
          writeOnly: true
          maxLength: 15
      required:
      - batch_number
      - id
      - product
      - received_at
    BlankEnum:
      enum:
      - ''
    Budget:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        patient:
          type: string
          format: uuid
        status:
          allOf:
          - $ref: '#/components/schemas/BudgetStatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        notes:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/BudgetItem'
          readOnly: true
        payment_plan_id:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - items
      - patient
      - payment_plan_id
      - status
      - status_display
      - total_amount
    BudgetItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        treatment:
          type: string
          format: uuid
        treatment_name:
          type: string
          readOnly: true
        tooth_fdi_code:
          type: string
          maxLength: 2
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - id
      - subtotal
      - treatment
      - treatment_name
      - unit_price
    BudgetStatusEnum:
      enum:
      - draft
      - approved
      - rejected
      type: string
      description: |-
        * `draft` - Borrador
        * `approved` - Aprobado
        * `rejected` - Rechazado
    Categoria:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nombre:
          type: string
          maxLength: 80
        clave:
          type: string
          readOnly: true
        activa:
          type: boolean
        orden:
          type: integer
          maximum: 32767
          minimum: 0
      required:
      - clave
      - id
      - nombre
    Clinic:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        ruc:
          type: string
          maxLength: 20
        address:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
          maxLength: 254
        is_active:
          type: boolean
        es_prueba:
          type: boolean
          title: Clínica de pruebas
          description: Recibe las funciones nuevas antes que las demás. Lo que se
            prueba aquí no llega a otras clínicas hasta publicarlo desde Plataforma.
        modalidad:
          $ref: '#/components/schemas/ModalidadEnum'
        admin:
          type: string
          readOnly: true
        condiciones:
          type: string
          readOnly: true
        funcionalidades: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - admin
      - condiciones
      - created_at
      - id
      - name
    ClinicalRecord:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        general_notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - updated_at
    ConsentSign:
      type: object
      description: Recibe la firma capturada en pantalla táctil como base64 PNG.
      properties:
        signature_image_base64:
          type: string
      required:
      - signature_image_base64
    ConsentTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        procedure:
          $ref: '#/components/schemas/ProcedureEnum'
        procedure_display:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 200
        procedure_text:
          type: string
          description: Descripción del procedimiento.
        benefits:
          type: string
        risks:
          type: string
        alternatives:
          type: string
